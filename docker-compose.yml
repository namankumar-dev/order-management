services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  product-service:
    build: ./product-service
    environment:
      INTERNAL_TOKEN: ${PRODUCT_SERVICE_TOKEN}
      PORT: "8081"
    ports:
      - "8081:8081"

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      PRODUCT_SERVICE_URL: http://product-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
    ports:
      - "8080:8080"
      - "9090:9090"

volumes:
  pgdata:
